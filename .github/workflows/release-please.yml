name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-assets:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install build
      - run: python -m build
      - run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  bump-tap:
    needs: [release-please, build-assets]
    if: ${{ needs.release-please.outputs.release_created }}
    # macOS, since Homebrew's Linux sandbox (Landlock) warns on every pip run that it can't fully isolate writes.
    runs-on: macos-latest
    steps:
      # bump-formula-pr can't refresh the Python resources of a formula whose url isn't on PyPI, so it only writes the
      # new url, update-python-resources resolves the resources from it, and the tap's script points them back at
      # wheels before the PR is opened and merged.
      - uses: Homebrew/actions/setup-homebrew@main
      # bash explicitly for pipefail, so a failed download stops the job instead of hashing nothing.
      - shell: bash
        run: |
          brew tap kelsin/tap
          brew trust kelsin/tap
          sha256=$(gh release download "$TAG" --repo kelsin/sync-roms --pattern "sync_roms-$VERSION.tar.gz" --output - \
            | shasum -a 256 | cut -d' ' -f1)
          brew bump-formula-pr --write-only --sha256 "$sha256" \
            --url "https://github.com/kelsin/sync-roms/releases/download/$TAG/sync_roms-$VERSION.tar.gz" \
            kelsin/tap/sync-roms
          brew update-python-resources kelsin/tap/sync-roms
          cd "$(brew --repository kelsin/tap)"
          python3 scripts/wheel-resources.py Formula/sync-roms.rb
          branch="bump-sync-roms-$VERSION"
          gh auth setup-git
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "sync-roms $VERSION"
          git push origin "$branch"
          gh pr create --repo kelsin/homebrew-tap --head "$branch" --title "sync-roms $VERSION" \
            --body "Bump sync-roms to $VERSION and refresh its Python resources."
          gh pr merge "$branch" --repo kelsin/homebrew-tap --squash --delete-branch
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
