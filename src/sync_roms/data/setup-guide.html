<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Setup Guide</title>
<style>
:root {
  --bg: #f6f3ee;
  --panel: #fffdf9;
  --ink: #1f1c18;
  --muted: #6d655b;
  --line: #e4ddd2;
  --accent: #c2410c;
  --accent-soft: #fbe6d9;
  --chip: #efe9df;
  --code: #f1ece4;
  --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 6px 24px rgba(40, 30, 20, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15130f;
    --panel: #1d1a16;
    --ink: #ede7de;
    --muted: #a39a8e;
    --line: #322d27;
    --accent: #fb923c;
    --accent-soft: #3a2517;
    --chip: #2a2621;
    --code: #26221d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html { --hdr: 120px; --tocbar: 0px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, kbd {
  font: .88em ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--code);
  border-radius: 5px;
  padding: .1em .4em;
}
kbd { border: 1px solid var(--line); border-bottom-width: 2px; }
a { color: var(--accent); }

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 1140px;
  margin: 0 auto;
  padding: 14px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  align-items: baseline;
}
.brand h1 { margin: 0; font-size: 1.25rem; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: .85rem; }
.picks {
  flex: 1 1 100%;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 12px;
}
label.pick[hidden] { display: none; }
label.pick { display: flex; flex-direction: column; gap: 3px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
select {
  font: inherit;
  font-size: .95rem;
  text-transform: none;
  letter-spacing: 0;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 32px 8px 12px;
  width: 100%;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { max-width: 1140px; margin: 0 auto; padding: 24px 16px 80px; }

.device {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  max-width: 1140px;
  margin: 0 auto;
  padding: 8px 16px;
}
.band { background: var(--chip); border-top: 1px solid var(--line); }
.facts-title { font-weight: 700; font-size: .95rem; line-height: 1.6; margin-right: 4px; }
.facts-title .dev { font-weight: 400; color: var(--muted); }
.facts-title .dot { color: var(--muted); font-weight: 400; margin: 0 .4em; }
.chip {
  background: var(--chip);
  border-radius: 999px;
  padding: 1px 12px;
  line-height: 1.6;
  font-size: .8rem;
  border: 1px solid var(--line);
  color: var(--muted);
}
.band .chip { background: var(--panel); }
.chip b { color: var(--ink); font-weight: 600; }

.layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 0 32px; align-items: start; }
#steps { max-width: 860px; }
nav.toc {
  position: sticky;
  top: calc(var(--hdr) + 16px);
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: calc(100vh - var(--hdr) - 32px);
  overflow-y: auto;
  border-left: 2px solid var(--line);
}
nav.toc a {
  text-decoration: none;
  font-size: .86rem;
  line-height: 1.35;
  color: var(--muted);
  padding: 5px 10px;
  margin-left: -2px;
  border-left: 2px solid transparent;
}
nav.toc a:hover { color: var(--accent); }
nav.toc a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; background: var(--accent-soft); }

section.step {
  scroll-margin-top: calc(var(--hdr) + var(--tocbar) + 16px);
  position: relative;
  padding-left: 56px;
  margin-bottom: 36px;
}
section.step::before {
  content: "";
  position: absolute;
  left: 17px;
  top: 40px;
  bottom: -36px;
  width: 2px;
  background: var(--line);
}
section.step:last-of-type::before { display: none; }
.num {
  position: absolute;
  left: 0;
  top: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: .95rem;
  background: var(--accent);
  color: var(--panel);
}
section.ref .num { background: var(--chip); color: var(--muted); }
section.step h2 { margin: 3px 0 4px; font-size: 1.3rem; letter-spacing: -.01em; }
.lede { margin: 0 0 14px; color: var(--muted); }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 16px 18px;
  margin-bottom: 12px;
}
.card h3 { margin: 0 0 6px; font-size: 1.02rem; }
.card p { margin: 6px 0; }
.card ol, .card ul { margin: 6px 0; padding-left: 1.3em; }
.card li { margin: 3px 0; }
.tags { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 2px; }
.tag {
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 5px;
  padding: 1px 6px;
  font-weight: 600;
}
.path { font-weight: 600; }
.path .sep { color: var(--muted); font-weight: 400; margin: 0 .25em; }

table.settings { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 6px; }
table.settings td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.settings td:last-child { text-align: right; padding-left: 16px; white-space: nowrap; font-weight: 600; }
table.settings .note { display: block; color: var(--muted); font-size: .85em; }

.empty {
  border: 1.5px dashed var(--line);
  border-radius: 14px;
  padding: 14px 18px;
  color: var(--muted);
  font-size: .92rem;
}

details.emu {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  overflow: hidden;
}
details.emu summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
details.emu summary::-webkit-details-marker { display: none; }
details.emu summary::before {
  content: "";
  width: 7px;
  height: 7px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg);
  transition: transform .15s;
  flex: none;
}
details.emu[open] summary::before { transform: rotate(45deg); }
details.emu summary .sys { font-weight: 600; }
details.emu summary .emu-name { margin-left: auto; color: var(--muted); font-size: .9rem; }
details.emu .body { padding: 0 18px 14px 35px; }
details.emu .body .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 10px 0 2px; }
.toggle-all { background: none; border: 0; color: var(--accent); font: inherit; font-size: .85rem; cursor: pointer; padding: 0; margin: 0 0 10px; }

code.copy { cursor: pointer; }
code.copy::after { content: "⧉"; margin-left: .35em; color: var(--muted); }
code.copy:hover::after { color: var(--accent); }
code.copy.copied::after { content: "✓ copied"; color: var(--accent); }

@media (max-width: 1000px) {
  .layout { display: block; }
  nav.toc {
    position: sticky;
    top: var(--hdr);
    z-index: 9;
    flex-direction: row;
    gap: 6px;
    max-height: none;
    overflow: auto hidden;
    border-left: 0;
    margin: -12px -16px 20px;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  nav.toc a { flex: none; white-space: nowrap; margin: 0; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  nav.toc a.active { border-color: var(--accent); }
}
@media (max-width: 560px) {
  section.step { padding-left: 0; }
  section.step::before { display: none; }
  .num { position: static; margin-bottom: 8px; }
  .picks { grid-auto-flow: row; gap: 8px; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <h1>Device Setup Guide</h1>
      <p>What I do to set up each handheld after <code>sync-roms</code> writes its card.</p>
    </div>
    <div class="picks">
      <label class="pick" id="card-pick" hidden>Card <select id="card"></select></label>
      <label class="pick">Device <select id="device"></select></label>
      <label class="pick">Layout <select id="layout"></select></label>
    </div>
  </div>
  <div class="band"><div class="device" id="facts"></div></div>
</header>

<main>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sections"></nav>
    <div id="steps"></div>
  </div>
</main>

function path(p) {
  return p.split(" > ").map(esc).join('<span class="sep">›</span>');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}
function matches(when, ctx) {
  if (!when) return true;
  return Object.entries(when).every(([k, vals]) =>
    k === "systems" ? vals.some(v => ctx.systems.includes(v)) : vals.includes(ctx[k]));
}
function tagsFor(when) {
  if (!when) return "";
  const names = [...(when.platform || []).map(p => PLATFORMS[p]), ...(when.layout || []).map(l => LAYOUTS[l])];
  return names.length ? `<span class="tags">${names.map(n => `<span class="tag">${esc(n)}</span>`).join("")}</span>` : "";
}
function settingsTable(rows) {
  if (!rows || !rows.length) return "";
  return `<table class="settings">${rows.map(([p, v, note]) =>
    `<tr><td><span class="path">${path(p)}</span>${note ? `<span class="note">${esc(note)}</span>` : ""}</td><td>${esc(v)}</td></tr>`
  ).join("")}</table>`;
}

const DEVICES = JSON.parse(document.getElementById("devices-data").textContent);
const DEVICE_SYSTEMS = JSON.parse(document.getElementById("systems-data").textContent);
const $device = document.getElementById("device");
const $layout = document.getElementById("layout");

// Devices grouped by brand (first word of the name), in file order.
const brands = new Map();
for (const d of DEVICES) {
  const brand = d.name.split(" ")[0];
  if (!brands.has(brand)) brands.set(brand, []);
  brands.get(brand).push(d);
}
for (const [brand, list] of brands) {
  const g = document.createElement("optgroup");
  g.label = brand;
  for (const d of list) g.append(new Option(d.name, d.id));
  $device.append(g);
}

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  return { device: h.get("device"), layout: h.get("layout") };
}

// Spruce first, and the default unless the device can run Android (ES-DE).
function fillLayouts(device, wanted) {
  const layouts = [...device.firmwares].sort((a, b) => (b === "spruce") - (a === "spruce"));
  $layout.innerHTML = "";
  for (const id of layouts) $layout.append(new Option(LAYOUTS[id] || id, id));
  const fallback = layouts.includes("spruce") && !layouts.includes("esde") ? "spruce" : device.firmwares[0];
  $layout.value = layouts.includes(wanted) ? wanted : fallback;
  $layout.disabled = layouts.length < 2;
}

// Saved cards: picking one sets the device and layout; changing either afterwards clears the pick.
const BEZELS = JSON.parse(document.getElementById("bezels-data").textContent);
const CARDS = JSON.parse(document.getElementById("cards-data").textContent)
  .filter(c => DEVICES.some(d => d.id === c.device));
const $card = document.getElementById("card");
if (CARDS.length) {
  document.getElementById("card-pick").hidden = false;
  $card.append(new Option("Pick a card…", ""));
  for (const c of CARDS) $card.append(new Option(c.name, c.name));
}
$card.addEventListener("change", () => {
  const c = CARDS.find(x => x.name === $card.value);
  if (!c) return;
  $device.value = c.device;
  fillLayouts(DEVICES.find(d => d.id === c.device), c.layout);
  render();
  $card.value = c.name;
});

function render() {
  const device = DEVICES.find(d => d.id === $device.value);
  const info = DEVICE_SYSTEMS[device.id] || { tier: null, systems: [] };
  const ctx = {
    layout: $layout.value, platform: platformOf(device, $layout.value), device: device.id,
    tier: info.tier, power: powerOf(info.tier), systems: info.systems, dualscreen: !!device.screen2, gpu: !!device.gpu, network: device.network !== false,
    bezels: BEZELS.includes(device.id),
  };
  ctx.emus = SECTIONS.find(s => s.id === "emulators").items.filter(e => matches(e.when, ctx));
  history.replaceState(null, "", `#device=${device.id}&layout=${ctx.layout}`);

  const screen = device.screen ? device.screen + (device.screen2 ? ` + ${device.screen2}` : "") : null;
  const title = $card.value ? `${esc($card.value)}<span class="dot">·</span><span class="dev">${esc(device.name)}</span>` : esc(device.name);
  document.getElementById("facts").innerHTML = `<span class="facts-title">${title}</span>` + [
    ["Platform", PLATFORMS[ctx.platform]],
    ["Layout", LAYOUTS[ctx.layout]],
    ["SoC", device.soc],
    ["Screen", screen],
  ].filter(([, v]) => v).map(([k, v]) => `<span class="chip">${k} <b>${esc(v)}</b></span>`).join("");

  const shown = SECTIONS.filter(s => matches(s.when, ctx));
  let n = 0;
  document.getElementById("toc").innerHTML = shown.map(s => `<a href="#${s.id}">${esc(s.title)}</a>`).join("");
  document.getElementById("steps").innerHTML = shown.map(s => {
    const items = s.items.filter(i => matches(i.when, ctx));
    const ref = !["flash", "install", "home", "raofflineproxy", "raofflineproxy-knulli", "raofflineproxy-rocknix", "raofflineproxy-app"].includes(s.id);
    let body;
    if (!items.length) {
      body = `<div class="empty">Nothing here yet for this ${s.id === "emulators" ? "platform" : "setup"}.</div>`;
    } else if (s.id === "emulators") {
      body = `<button class="toggle-all" type="button">Expand all</button>` + items.map(e => `
        <details class="emu">
          <summary><span class="sys">${esc(e.system)}</span>${tagsFor(e.when)}<span class="emu-name">${esc(e.emulator)}</span></summary>
          <div class="body">
            <div class="label">Install from</div><div>${e.install}</div>
            ${e.settings && e.settings.length ? `<div class="label">Settings</div>${settingsTable(e.settings)}` : ""}
          </div>
        </details>`).join("");
    } else {
      body = items.map(i => `
        <div class="card">
          <h3>${esc(i.title)}${tagsFor(i.when)}</h3>
          ${typeof i.body === "function" ? i.body(ctx) : i.body || ""}
          ${settingsTable(i.settingsFn ? i.settingsFn(ctx) : i.settings)}
        </div>`).join("");
    }
    return `
      <section class="step${ref ? " ref" : ""}" id="${s.id}">
        <div class="num">${++n}</div>
        <h2>${esc(s.title)}</h2>
        <p class="lede">${s.lede}</p>
        ${body}
      </section>`;
  }).join("");
  active = null;
  measure();
  track();
}

document.getElementById("steps").addEventListener("click", e => {
  if (!e.target.matches(".toggle-all")) return;
  const all = [...e.target.parentElement.querySelectorAll("details.emu")];
  const open = !all.every(d => d.open);
  all.forEach(d => (d.open = open));
  e.target.textContent = open ? "Collapse all" : "Expand all";
});

// Click a code.copy value to copy it to the clipboard (the execCommand fallback covers file:// pages without clipboard access).
document.addEventListener("click", e => {
  const code = e.target.closest("code.copy");
  if (!code) return;
  const text = code.textContent;
  const done = () => {
    code.classList.add("copied");
    setTimeout(() => code.classList.remove("copied"), 1200);
  };
  const fallback = () => {
    const r = document.createRange();
    r.selectNodeContents(code);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
    if (document.execCommand("copy")) done();
    s.removeAllRanges();
  };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
});

// The hash holds the device and layout, so section links scroll instead of navigating.
document.getElementById("toc").addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  e.preventDefault();
  const id = a.getAttribute("href").slice(1);
  locked = true;
  document.getElementById(id).scrollIntoView();
  setActive(id);
});

// Keep the sticky header and section bar heights in CSS so anchors land below them.
const $toc = document.getElementById("toc");
function measure() {
  const root = document.documentElement.style;
  root.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
  const bar = getComputedStyle($toc).flexDirection === "row";
  root.setProperty("--tocbar", bar ? $toc.offsetHeight + "px" : "0px");
}
new ResizeObserver(measure).observe(document.querySelector("header"));
window.addEventListener("resize", measure);

// Highlight the section being read: the last one whose top is above the sticky bars.
let active = null;
function setActive(id) {
  if (id === active) return;
  active = id;
  for (const a of $toc.children) {
    const on = a.getAttribute("href") === "#" + id;
    a.classList.toggle("active", on);
    if (on) {
      if ($toc.scrollHeight > $toc.clientHeight || $toc.scrollWidth > $toc.clientWidth) {
        const r = a.getBoundingClientRect(), t = $toc.getBoundingClientRect();
        if (getComputedStyle($toc).flexDirection === "row") $toc.scrollLeft += r.left - t.left - 16;
        else if (r.top < t.top || r.bottom > t.bottom) $toc.scrollTop += r.top - t.top - 16;
      }
    }
  }
}
// After a jump the clicked section stays highlighted (the last, short sections can't reach the top) until the reader scrolls by hand.
let locked = false;
for (const ev of ["wheel", "touchstart", "keydown", "mousedown"]) {
  window.addEventListener(ev, e => { if (!(e.target.closest && e.target.closest("#toc"))) locked = false; }, { passive: true });
}
let ticking = false;
function track() {
  ticking = false;
  if (locked) return;
  const secs = [...document.querySelectorAll("section.step")];
  if (!secs.length) return;
  const line = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hdr")) + (parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tocbar")) || 0) + 24;
  let cur = secs[0];
  for (const s of secs) if (s.getBoundingClientRect().top <= line) cur = s;
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 2) cur = secs[secs.length - 1];
  setActive(cur.id);
}
window.addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(track); } }, { passive: true });

function applyHash() {
  const { device, layout } = readHash();
  const d = DEVICES.find(x => x.id === device) || DEVICES[0];
  $device.value = d.id;
  fillLayouts(d, layout);
  render();
}
$device.addEventListener("change", () => {
  $card.value = "";
  fillLayouts(DEVICES.find(d => d.id === $device.value), $layout.value);
  render();
});
$layout.addEventListener("change", () => { $card.value = ""; render(); });
window.addEventListener("hashchange", applyHash);
applyHash();
</script>
</body>
