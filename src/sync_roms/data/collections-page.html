<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROM Collections</title>
<style>
:root {
  --bg: #f5f3ef;
  --surface: #ffffff;
  --surface-2: #f0ede7;
  --text: #1f1d1a;
  --muted: #6b665e;
  --border: #e2ddd4;
  --accent: #b4532a;
  --accent-soft: #f6e3d8;
  --accent-text: #8a3b19;
  --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 4px 14px rgba(40, 30, 20, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514;
    --surface: #211f1d;
    --surface-2: #2a2825;
    --text: #ece8e1;
    --muted: #a39d93;
    --border: #36332f;
    --accent: #e48a5c;
    --accent-soft: #3b2a20;
    --accent-text: #f2b08e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
header { padding: 28px 0 8px; }
h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
.bar {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg);
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.controls input, .controls select, .controls button, .chip {
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 8px;
  padding: 7px 10px;
  min-width: 0;
}
.controls input { flex: 1 1 220px; }
.tagbox {
  flex: 1 1 100%; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 3px 6px;
}
.tagbox:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.controls .tagbox input { flex: 1 1 100px; border: 0; background: none; padding: 4px; outline: none; }
.controls select { flex: 0 1 220px; }
.controls button { cursor: pointer; }
input:focus-visible, select:focus-visible, button:focus-visible, [role="button"]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.chips { display: contents; }
.chip { cursor: pointer; border-radius: 999px; padding: 2px 10px; font-size: 14px; }
.chip { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.count { margin-top: 10px; color: var(--muted); font-size: 14px; }
.list { display: flex; flex-direction: column; gap: 14px; }
.row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  overflow: clip; /* clips to the rounded corners without making a scroll container, so the header can stick */
  min-width: 0;
}
.rhead {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: center;
  padding: 14px 16px; background: var(--surface); cursor: default;
}
.rhead[role="button"] { cursor: pointer; }
.rhead[role="button"]:hover { background: var(--surface-2); }
.rhead:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.row.open .rhead { position: sticky; top: var(--bar-h, 0px); z-index: 1; border-bottom: 1px solid var(--border); }
.rtitle { display: flex; align-items: center; gap: 10px; }
.chev { flex: none; width: 1em; color: var(--accent-text); font-size: 20px; line-height: 1; }
.chev::before { content: "\25B8"; }
.row.open .chev::before { content: "\25BE"; }
.name { margin: 0; font-size: 22px; line-height: 1.25; overflow-wrap: anywhere; flex: 0 1 auto; min-width: 0; }
.link {
  flex: none; border: 1px solid var(--border); background: var(--surface); border-radius: 6px;
  padding: 2px 8px; font-size: 13px; cursor: pointer;
}
.link.done { border-color: var(--accent); color: var(--accent-text); }
.desc { margin: 4px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.meta { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.rtags { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 2px 6px; font-size: 16px; line-height: 1.3; }
.rtags span { cursor: default; }
.pics { display: flex; gap: 8px; align-items: center; justify-content: flex-end; height: 120px; }
.pics img { display: block; height: 100%; width: auto; flex: none; border-radius: 6px; }
.tablewrap { overflow-x: auto; }
table.games { width: 100%; border-collapse: collapse; }
.games th, .games td { padding: 8px 14px; text-align: left; vertical-align: middle; }
.games th { background: var(--surface-2); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; color: var(--muted); }
.games th .sort { border: 0; background: none; padding: 2px 0; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.games th .sort:hover { color: var(--text); }
.games th .sort.on { color: var(--accent-text); }
.games td { border-top: 1px solid var(--border); }
.games tbody tr:nth-child(even) { background: var(--surface-2); }
.games .col-system { width: 22%; color: var(--muted); }
.games .col-tags { width: 150px; }
.games .col-copy { width: 90px; text-align: right; }
.games .title { overflow-wrap: anywhere; }
.sys-inline { display: none; font-size: 13px; color: var(--muted); }
.cell-tags span { cursor: default; margin-right: 4px; }
.copy {
  border: 1px solid var(--border); background: var(--surface); border-radius: 6px;
  padding: 4px 10px; font-size: 13px; cursor: pointer; min-width: 64px;
}
.copy.done { border-color: var(--accent); color: var(--accent-text); }
.nomatch td { color: var(--muted); font-size: 14px; }
@media (max-width: 640px) {
  .rhead { grid-template-columns: minmax(0, 1fr); padding: 12px; }
  .pics { height: 96px; justify-content: flex-start; }
  .name { font-size: 20px; }
  .games th, .games td { padding: 8px 10px; }
  .games .col-system { display: none; }
  .games .col-tags { width: 84px; }
  .games .col-copy { width: 76px; }
  .sys-inline { display: block; }
  .copy, .link { min-height: 36px; }
}
.empty { color: var(--muted); text-align: center; padding: 48px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>ROM Collections</h1></header>
  <div class="bar">
    <div class="controls">
      <input id="search" type="search" placeholder="Search collections and games" aria-label="Search">
      <select id="system" aria-label="System"></select>
      <button id="clear" type="button">Clear</button>
      <div class="tagbox">
        <span class="chips" id="chips"></span>
        <input id="tag-input" type="text" list="tag-options" placeholder="Filter by tag" aria-label="Filter by tag" autocomplete="off">
        <datalist id="tag-options"></datalist>
      </div>
    </div>
    <div class="count" id="count"></div>
  </div>
  <main class="list" id="grid"></main>
  <p class="empty" id="empty" hidden></p>
</div>
<!-- The page's data, filled in by `sync-roms collections page`; empty in the repo. -->
<script type="application/json" id="page-data">{}</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("page-data").textContent);
  var tagDefs = data.tags || {};
  var systems = data.systems || {};
  var list = data.collections || [];
  var pressed = new Set();
  var cards = [];
  var current = null;

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
  function byName(a, b) { return a.name.localeCompare(b.name); }

  var select = document.getElementById("system");
  var all = el("option", "", "All systems");
  all.value = "";
  select.appendChild(all);
  Object.keys(systems).map(function (id) { return {id: id, name: systems[id]}; }).sort(byName)
    .forEach(function (s) {
      var option = el("option", "", s.name);
      option.value = s.id;
      select.appendChild(option);
    });

  var chips = document.getElementById("chips");
  var tagInput = document.getElementById("tag-input");
  var tagList = Object.keys(tagDefs).map(function (id) {
    return {id: id, name: tagDefs[id].name, emoji: tagDefs[id].emoji};
  }).sort(byName);
  var options = document.getElementById("tag-options");
  tagList.forEach(function (t) {
    var option = el("option");
    option.value = t.emoji + " " + t.name;
    options.appendChild(option);
  });
  function renderChips() {
    chips.textContent = "";
    tagList.filter(function (t) { return pressed.has(t.id); }).forEach(function (t) {
      var chip = el("button", "chip", t.emoji + " " + t.name + " \u00d7");
      chip.type = "button";
      chip.title = "Remove " + t.name;
      chip.setAttribute("aria-label", "Remove tag " + t.name);
      chip.addEventListener("click", function () {
        pressed.delete(t.id);
        renderChips();
        update();
      });
      chips.appendChild(chip);
    });
  }
  function addTag(typed, prefix) {
    var text = typed.trim().toLowerCase();
    if (!text) return false;
    var free = tagList.filter(function (t) { return !pressed.has(t.id); });
    var hits = free.filter(function (t) {
      return t.name.toLowerCase() === text || (t.emoji + " " + t.name).toLowerCase() === text;
    });
    if (!hits.length && prefix) {
      hits = free.filter(function (t) { return t.name.toLowerCase().indexOf(text) !== -1; });
      if (hits.length !== 1) hits = [];
    }
    if (hits.length !== 1) return false;
    pressed.add(hits[0].id);
    tagInput.value = "";
    renderChips();
    update();
    return true;
  }
  tagInput.addEventListener("input", function () { addTag(tagInput.value, false); });
  tagInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") { event.preventDefault(); addTag(tagInput.value, true); }
  });

  function fallbackCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try {
      return document.execCommand("copy") === true;
    } catch (e) {
      return false;
    } finally {
      document.body.removeChild(area);
    }
  }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; },
        function () { return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function copyButton(button, text, label) {
    var timer;
    button.addEventListener("click", function () {
      copy(text()).then(function (ok) {
        button.textContent = ok ? "Copied" : "Copy failed";
        button.classList.toggle("done", ok);
        clearTimeout(timer);
        timer = setTimeout(function () {
          button.textContent = label;
          button.classList.remove("done");
        }, 1500);
      });
    });
  }

  var sortKey = "name", sortDir = 1;
  var bar = document.querySelector(".bar");

  function gameRow(game) {
    var row = el("tr", "game");
    var name = el("td", "");
    name.appendChild(el("div", "title", game.title));
    name.appendChild(el("div", "sys-inline", systems[game.system] || game.system));
    row.appendChild(name);
    row.appendChild(el("td", "col-system", systems[game.system] || game.system));
    var tagCell = el("td", "col-tags cell-tags");
    (game.tags || []).forEach(function (id) {
      var def = tagDefs[id];
      if (!def) return;
      var span = el("span", "", def.emoji);
      span.title = def.name;
      tagCell.appendChild(span);
    });
    row.appendChild(tagCell);
    var paths = (game.paths || []).join("\n");
    var button = el("button", "copy", "Copy");
    button.type = "button";
    button.title = paths;
    copyButton(button, function () { return paths; }, "Copy");
    var last = el("td", "col-copy");
    last.appendChild(button);
    row.appendChild(last);
    return row;
  }

  function tagsOf(c) {
    var seen = {};
    (c.games || []).forEach(function (g) {
      (g.tags || []).forEach(function (id) { if (tagDefs[id]) seen[id] = true; });
    });
    return Object.keys(seen).map(function (id) { return {id: id, name: tagDefs[id].name, emoji: tagDefs[id].emoji}; })
      .sort(byName);
  }

  var grid = document.getElementById("grid");
  list.forEach(function (c) {
    var row = el("article", "row");
    var art = c.art || {};
    var head = el("div", "rhead");
    var text = el("div", "rtext");
    var title = el("div", "rtitle");
    title.appendChild(el("span", "chev"));
    title.lastChild.setAttribute("aria-hidden", "true");
    title.appendChild(el("h2", "name", c.name));
    var link = el("button", "link", "🔗");
    link.type = "button";
    link.title = "Copy link to this collection";
    link.setAttribute("aria-label", "Copy link to this collection");
    copyButton(link, function () { return pageUrl() + "#" + params(c.id).toString(); }, "🔗");
    link.addEventListener("click", function (event) { event.stopPropagation(); });
    link.addEventListener("keydown", function (event) { event.stopPropagation(); });
    title.appendChild(link);
    text.appendChild(title);
    if (c.description) text.appendChild(el("p", "desc", c.description));
    var meta = el("p", "meta");
    text.appendChild(meta);
    var tagBox = el("div", "rtags");
    tagsOf(c).forEach(function (t) {
      var span = el("span", "", t.emoji);
      span.title = t.name;
      tagBox.appendChild(span);
    });
    if (tagBox.childNodes.length) text.appendChild(tagBox);
    head.appendChild(text);
    var pics = el("div", "pics");
    [["box", "box"], ["band", "band"], ["totk", "ToTK"]].forEach(function (kind) {
      if (!art[kind[0]]) return;
      var img = document.createElement("img");
      img.loading = "lazy";
      img.src = art[kind[0]];
      img.alt = c.name + " " + kind[1];
      pics.appendChild(img);
    });
    if (pics.childNodes.length) head.appendChild(pics);
    row.appendChild(head);
    var games = (c.games || []).map(function (g, i) { return {game: g, index: i, tr: null}; });
    var entry = {collection: c, row: row, head: head, meta: meta, body: null, games: games, matching: games,
                 filtering: false, ths: null, tbody: null};
    if (games.length) {
      head.setAttribute("role", "button");
      head.tabIndex = 0;
      head.setAttribute("aria-expanded", "false");
      head.addEventListener("click", function () { toggle(entry); });
      head.addEventListener("keydown", function (event) {
        if (event.target === head && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          toggle(entry);
        }
      });
    }
    grid.appendChild(row);
    cards.push(entry);
  });

  function buildBody(entry) {
    var wrap = el("div", "tablewrap");
    var table = el("table", "games");
    var tr = el("tr");
    entry.ths = {};
    [["name", "Name", ""], ["system", "System", "col-system"], [null, "Tags", "col-tags"], [null, "", "col-copy"]]
      .forEach(function (col) {
        var th = el("th", col[2]);
        th.scope = "col";
        if (col[0]) {
          var button = el("button", "sort");
          button.type = "button";
          button.addEventListener("click", function () {
            if (sortKey === col[0]) sortDir = -sortDir;
            else { sortKey = col[0]; sortDir = 1; }
            cards.forEach(function (other) { if (other.body) renderTable(other); });
          });
          th.appendChild(button);
          entry.ths[col[0]] = {th: th, button: button, label: col[1]};
        } else {
          th.textContent = col[1];
        }
        tr.appendChild(th);
      });
    var thead = el("thead");
    thead.appendChild(tr);
    table.appendChild(thead);
    entry.tbody = el("tbody");
    table.appendChild(entry.tbody);
    wrap.appendChild(table);
    entry.body = wrap;
    entry.row.appendChild(wrap);
  }

  function renderTable(entry) {
    if (!entry.body) buildBody(entry);
    Object.keys(entry.ths).forEach(function (key) {
      var h = entry.ths[key];
      var on = key === sortKey;
      h.button.textContent = h.label + (on ? (sortDir > 0 ? " ▲" : " ▼") : "");
      h.button.classList.toggle("on", on);
      h.th.setAttribute("aria-sort", on ? (sortDir > 0 ? "ascending" : "descending") : "none");
    });
    var rows = entry.matching.slice();
    rows.sort(function (a, b) {
      var order = 0;
      if (sortKey === "system") {
        order = (systems[a.game.system] || a.game.system).localeCompare(systems[b.game.system] || b.game.system);
      }
      return (order || a.index - b.index) * sortDir;
    });
    entry.tbody.textContent = "";
    rows.forEach(function (r) {
      if (!r.tr) r.tr = gameRow(r.game);
      entry.tbody.appendChild(r.tr);
    });
    if (!rows.length) {
      var none = el("tr", "nomatch");
      var cell = el("td", "", "No games match the filters");
      cell.colSpan = 4;
      none.appendChild(cell);
      entry.tbody.appendChild(none);
    }
  }

  var search = document.getElementById("search");
  var count = document.getElementById("count");
  var empty = document.getElementById("empty");

  function params(collection) {
    var out = new URLSearchParams();
    var query = search.value.trim();
    if (query) out.set("q", query);
    if (select.value) out.set("system", select.value);
    if (pressed.size) out.set("tags", Array.from(pressed).sort().join(","));
    if (collection) out.set("c", collection);
    return out;
  }
  function pageUrl() {
    if (location.origin === "null") return location.href.split("#")[0];
    return location.origin + location.pathname;
  }
  function writeHash() {
    var hash = params(current).toString();
    try {
      if (hash) history.replaceState(null, "", "#" + hash);
      else history.replaceState(null, "", location.pathname + location.search);
    } catch (e) {
      // Some browsers refuse replaceState on file:// pages; the page still works without the hash.
    }
  }
  function barHeight() { return Math.round(bar.getBoundingClientRect().height); }
  function measureBar() {
    document.documentElement.style.setProperty("--bar-h", barHeight() + "px");
  }
  function scrollToRow(entry) {
    var top = entry.row.getBoundingClientRect().top + window.scrollY;
    window.scrollTo(0, top - barHeight() - 12);
  }
  function openEntry() {
    return cards.filter(function (entry) { return entry.collection.id === current; })[0];
  }
  function toggle(entry) {
    var before = entry.row.getBoundingClientRect().top;
    var closing = current === entry.collection.id;
    current = closing ? null : entry.collection.id;
    update();
    var after = entry.row.getBoundingClientRect().top;
    if (!closing && after !== before) window.scrollBy(0, after - before); // keep the row where it was
    if (entry.row.getBoundingClientRect().top < barHeight()) scrollToRow(entry);
  }
  function applyHash() {
    var hash = new URLSearchParams(location.hash.slice(1));
    search.value = hash.get("q") || "";
    var system = hash.get("system") || "";
    select.value = Object.prototype.hasOwnProperty.call(systems, system) ? system : "";
    pressed.clear();
    (hash.get("tags") || "").split(",").forEach(function (id) {
      if (id && Object.prototype.hasOwnProperty.call(tagDefs, id)) pressed.add(id);
    });
    renderChips();
    var wanted = hash.get("c");
    var target = cards.filter(function (entry) { return entry.collection.id === wanted && entry.games.length; })[0];
    current = target ? wanted : null;
    update();
    if (target) scrollToRow(target);
  }

  function update() {
    var query = search.value.trim().toLowerCase();
    var system = select.value;
    var filtering = Boolean(query || system || pressed.size);
    var shownCollections = 0, shownGames = 0;
    cards.forEach(function (entry) {
      var nameHit = query && entry.collection.name.toLowerCase().indexOf(query) !== -1;
      entry.matching = entry.games.filter(function (r) {
        var g = r.game;
        return (!query || nameHit || String(g.title).toLowerCase().indexOf(query) !== -1) &&
          (!system || g.system === system) &&
          Array.from(pressed).every(function (t) { return (g.tags || []).indexOf(t) !== -1; });
      });
      var passing = entry.matching.length;
      var picked = entry.collection.id === current;
      var visible = picked || !filtering || passing > 0;
      entry.row.hidden = !visible;
      entry.row.classList.toggle("open", picked);
      entry.head.setAttribute("aria-expanded", picked ? "true" : "false");
      if (picked) renderTable(entry);
      if (entry.body) entry.body.hidden = !picked;
      var total = entry.games.length;
      entry.meta.textContent = filtering && passing !== total
        ? passing + " of " + plural(total, "game") : plural(total, "game");
      if (visible) { shownCollections++; shownGames += passing; }
    });
    count.textContent = plural(shownCollections, "collection") + " · " + plural(shownGames, "game");
    if (!list.length) {
      empty.textContent = "No collections yet.";
      empty.hidden = false;
    } else if (!shownCollections) {
      empty.textContent = "No games match.";
      empty.hidden = false;
    } else {
      empty.hidden = true;
    }
    writeHash();
  }

  search.addEventListener("input", update);
  select.addEventListener("change", update);
  document.getElementById("clear").addEventListener("click", function () {
    search.value = "";
    select.value = "";
    pressed.clear();
    tagInput.value = "";
    renderChips();
    update();
  });
  window.addEventListener("hashchange", applyHash);
  window.addEventListener("resize", function () { measureBar(); });
  if (window.ResizeObserver) new ResizeObserver(measureBar).observe(bar);
  measureBar();
  applyHash();
})();
</script>
</body>
</html>
