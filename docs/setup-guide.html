<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Setup Guide</title>
<style>
:root {
  --bg: #f6f3ee;
  --panel: #fffdf9;
  --ink: #1f1c18;
  --muted: #6d655b;
  --line: #e4ddd2;
  --accent: #c2410c;
  --accent-soft: #fbe6d9;
  --chip: #efe9df;
  --code: #f1ece4;
  --shadow: 0 1px 2px rgba(40, 30, 20, .06), 0 6px 24px rgba(40, 30, 20, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15130f;
    --panel: #1d1a16;
    --ink: #ede7de;
    --muted: #a39a8e;
    --line: #322d27;
    --accent: #fb923c;
    --accent-soft: #3a2517;
    --chip: #2a2621;
    --code: #26221d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 24px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, kbd {
  font: .88em ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--code);
  border-radius: 5px;
  padding: .1em .4em;
}
kbd { border: 1px solid var(--line); border-bottom-width: 2px; }
a { color: var(--accent); }

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 860px;
  margin: 0 auto;
  padding: 14px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: end;
}
.brand { flex: 1 1 200px; }
.brand h1 { margin: 0; font-size: 1.25rem; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: .85rem; }
label.pick { display: flex; flex-direction: column; gap: 3px; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
select {
  font: inherit;
  font-size: .95rem;
  text-transform: none;
  letter-spacing: 0;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 32px 8px 12px;
  min-width: 13rem;
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }

.device {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 28px;
}
.chip {
  background: var(--chip);
  border-radius: 999px;
  padding: 3px 12px;
  font-size: .82rem;
  color: var(--muted);
}
.chip b { color: var(--ink); font-weight: 600; }

nav.toc {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: -12px 0 28px;
}
nav.toc a {
  text-decoration: none;
  font-size: .82rem;
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px;
}
nav.toc a:hover { color: var(--accent); border-color: var(--accent); }

section.step {
  position: relative;
  padding-left: 56px;
  margin-bottom: 36px;
}
section.step::before {
  content: "";
  position: absolute;
  left: 17px;
  top: 40px;
  bottom: -36px;
  width: 2px;
  background: var(--line);
}
section.step:last-of-type::before { display: none; }
.num {
  position: absolute;
  left: 0;
  top: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: .95rem;
  background: var(--accent);
  color: var(--panel);
}
section.ref .num { background: var(--chip); color: var(--muted); }
section.step h2 { margin: 3px 0 4px; font-size: 1.3rem; letter-spacing: -.01em; }
.lede { margin: 0 0 14px; color: var(--muted); }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 16px 18px;
  margin-bottom: 12px;
}
.card h3 { margin: 0 0 6px; font-size: 1.02rem; }
.card p { margin: 6px 0; }
.card ol, .card ul { margin: 6px 0; padding-left: 1.3em; }
.card li { margin: 3px 0; }
.tags { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 2px; }
.tag {
  font-size: .68rem;
  text-transform: uppercase;
  letter-spacing: .06em;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 5px;
  padding: 1px 6px;
  font-weight: 600;
}
.path { font-weight: 600; }
.path .sep { color: var(--muted); font-weight: 400; margin: 0 .25em; }

table.settings { width: 100%; border-collapse: collapse; font-size: .92rem; margin-top: 6px; }
table.settings td { padding: 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
table.settings td:last-child { text-align: right; padding-left: 16px; white-space: nowrap; font-weight: 600; }
table.settings .note { display: block; color: var(--muted); font-size: .85em; }

.empty {
  border: 1.5px dashed var(--line);
  border-radius: 14px;
  padding: 14px 18px;
  color: var(--muted);
  font-size: .92rem;
}

details.emu {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
  overflow: hidden;
}
details.emu summary {
  cursor: pointer;
  list-style: none;
  padding: 13px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
details.emu summary::-webkit-details-marker { display: none; }
details.emu summary::before {
  content: "";
  width: 7px;
  height: 7px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(-45deg);
  transition: transform .15s;
  flex: none;
}
details.emu[open] summary::before { transform: rotate(45deg); }
details.emu summary .sys { font-weight: 600; }
details.emu summary .emu-name { margin-left: auto; color: var(--muted); font-size: .9rem; }
details.emu .body { padding: 0 18px 14px 35px; }
details.emu .body .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 10px 0 2px; }
.toggle-all { background: none; border: 0; color: var(--accent); font: inherit; font-size: .85rem; cursor: pointer; padding: 0; margin: 0 0 10px; }

@media (max-width: 560px) {
  section.step { padding-left: 0; }
  section.step::before { display: none; }
  .num { position: static; margin-bottom: 8px; }
  select { min-width: 0; width: 100%; }
  label.pick { flex: 1 1 100%; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <h1>Device Setup Guide</h1>
      <p>What I do to set up each handheld after <code>sync-roms</code> writes its card.</p>
    </div>
    <label class="pick">Device <select id="device"></select></label>
    <label class="pick">Layout <select id="layout"></select></label>
  </div>
</header>

<main>
  <div class="device" id="facts"></div>
  <nav class="toc" id="toc"></nav>
  <div id="steps"></div>
</main>

<script>
const LAYOUTS = {
  esde: "ES-DE",
  knulli: "Knulli",
  onion: "Onion",
  allium: "Allium",
  emudeck: "EmuDeck",
};

// The platform a device runs with a layout: steps can target a platform, a layout or both.
function platformOf(device, layout) {
  if (layout === "emudeck") return "steamos";
  if (layout === "esde") return device.id === "windows-pc" ? "windows" : "android";
  return "linux";
}
const PLATFORMS = { android: "Android", windows: "Windows", steamos: "SteamOS", linux: "Linux" };

/*
  Guide content. Each section and each item may have a `when`:
    { platform: ["android", ...], layout: ["esde", ...] }
  and is only shown when the picked device and layout match every key given.
  Items:  { title, when?, body?: HTML, settings?: [[menu path, value, note?], ...] }
  Emulators (in the "emulators" section): { system, emulator, when?, install: HTML, settings?: [...] }
  Write menu paths with " > " between levels.
*/
const SECTIONS = [
  {
    id: "install",
    title: "Install the apps",
    lede: "The card's <code>APKs/</code> folder has everything needed to get going.",
    when: { platform: ["android"] },
    items: [
      {
        title: "Install ES-DE, Obtainium and MiXplorer",
        body: `
          <ol>
            <li>Open the device's built-in <b>Files</b> app and go to the SD card's <code>APKs/</code> folder.</li>
            <li>Tap each APK below. The first time, Android asks to allow installs from Files: tap <b>Settings</b>, turn on <b>Allow from this source</b>, then go back.
              <ul>
                <li><b>ES-DE</b>: <code>es-de-*.apk</code></li>
                <li><b>Obtainium</b>: <code>obtainium.apk</code></li>
                <li><b>MiXplorer</b>: <code>mixplorer-*.apk</code></li>
              </ul>
            </li>
          </ol>`,
      },
      {
        title: "Install emulators and RAOfflineProxy with Obtainium",
        body: `
          <ol>
            <li>Open <b>Obtainium</b> and go to <span class="path">${path("Import/Export > Obtainium Import")}</span>.</li>
            <li>Pick the emulation pack from the card's <code>APKs/</code> folder: <code>obtainium-emulation-pack-*.json</code>.</li>
            <li>In <b>Apps</b>, tap each wanted emulator and <b>RAOfflineProxy</b>, then <b>Install</b>. The first install asks to allow installs from Obtainium: turn on <b>Allow from this source</b>.</li>
          </ol>`,
      },
    ],
  },
  {
    id: "esde",
    title: "ES-DE settings",
    lede: "What I change in ES-DE's main menu.",
    when: { layout: ["esde", "emudeck"] },
    items: [],
  },
  {
    id: "knulli",
    title: "Knulli settings",
    lede: "What I change in Knulli's main menu.",
    when: { layout: ["knulli"] },
    items: [],
  },
  {
    id: "retroarch",
    title: "RetroArch settings",
    lede: "Shared settings for the cores I use; some apply only on one platform or layout.",
    items: [],
  },
  {
    id: "emulators",
    title: "Standalone emulators",
    lede: "Systems I don't run in RetroArch: where each emulator comes from and how I set it up.",
    items: [],
  },
  {
    id: "home",
    title: "Make ES-DE the home app",
    lede: "Last, so the device boots straight into ES-DE.",
    when: { platform: ["android"] },
    items: [
      {
        title: "Set the default home app",
        body: `
          <p class="path">${path("Settings > Apps > Default apps > Home app")}</p>
          <p>Pick <b>ES-DE</b>. Press <kbd>Home</kbd> to check it opens ES-DE.</p>
          <p>If it isn't there, search Settings for <i>Home app</i>.</p>`,
      },
    ],
  },
];

function path(p) {
  return p.split(" > ").map(esc).join('<span class="sep">›</span>');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}
function matches(when, ctx) {
  if (!when) return true;
  return Object.entries(when).every(([k, vals]) => vals.includes(ctx[k]));
}
function tagsFor(when) {
  if (!when) return "";
  const names = [...(when.platform || []).map(p => PLATFORMS[p]), ...(when.layout || []).map(l => LAYOUTS[l])];
  return names.length ? `<span class="tags">${names.map(n => `<span class="tag">${esc(n)}</span>`).join("")}</span>` : "";
}
function settingsTable(rows) {
  if (!rows || !rows.length) return "";
  return `<table class="settings">${rows.map(([p, v, note]) =>
    `<tr><td><span class="path">${path(p)}</span>${note ? `<span class="note">${esc(note)}</span>` : ""}</td><td>${esc(v)}</td></tr>`
  ).join("")}</table>`;
}

const DEVICES = JSON.parse(document.getElementById("devices-data").textContent);
const $device = document.getElementById("device");
const $layout = document.getElementById("layout");

// Devices grouped by brand (first word of the name), in file order.
const brands = new Map();
for (const d of DEVICES) {
  const brand = d.name.split(" ")[0];
  if (!brands.has(brand)) brands.set(brand, []);
  brands.get(brand).push(d);
}
for (const [brand, list] of brands) {
  const g = document.createElement("optgroup");
  g.label = brand;
  for (const d of list) g.append(new Option(d.name, d.id));
  $device.append(g);
}

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  return { device: h.get("device"), layout: h.get("layout") };
}

function fillLayouts(device, wanted) {
  $layout.innerHTML = "";
  for (const id of device.firmwares) $layout.append(new Option(LAYOUTS[id] || id, id));
  $layout.value = device.firmwares.includes(wanted) ? wanted : device.firmwares[0];
  $layout.disabled = device.firmwares.length < 2;
}

function render() {
  const device = DEVICES.find(d => d.id === $device.value);
  const ctx = { layout: $layout.value, platform: platformOf(device, $layout.value) };
  history.replaceState(null, "", `#device=${device.id}&layout=${ctx.layout}`);

  const screen = device.screen ? device.screen + (device.screen2 ? ` + ${device.screen2}` : "") : null;
  document.getElementById("facts").innerHTML = [
    ["Platform", PLATFORMS[ctx.platform]],
    ["Layout", LAYOUTS[ctx.layout]],
    ["SoC", device.soc],
    ["Screen", screen],
  ].filter(([, v]) => v).map(([k, v]) => `<span class="chip">${k} <b>${esc(v)}</b></span>`).join("");

  const shown = SECTIONS.filter(s => matches(s.when, ctx));
  let n = 0;
  document.getElementById("toc").innerHTML = shown.map(s => `<a href="#${s.id}">${esc(s.title)}</a>`).join("");
  document.getElementById("steps").innerHTML = shown.map(s => {
    const items = s.items.filter(i => matches(i.when, ctx));
    const ref = s.id !== "install" && s.id !== "home";
    let body;
    if (!items.length) {
      body = `<div class="empty">Nothing here yet for this ${s.id === "emulators" ? "platform" : "setup"}.</div>`;
    } else if (s.id === "emulators") {
      body = `<button class="toggle-all" type="button">Expand all</button>` + items.map(e => `
        <details class="emu">
          <summary><span class="sys">${esc(e.system)}</span>${tagsFor(e.when)}<span class="emu-name">${esc(e.emulator)}</span></summary>
          <div class="body">
            <div class="label">Install from</div><div>${e.install}</div>
            ${e.settings && e.settings.length ? `<div class="label">Settings</div>${settingsTable(e.settings)}` : ""}
          </div>
        </details>`).join("");
    } else {
      body = items.map(i => `
        <div class="card">
          <h3>${esc(i.title)}${tagsFor(i.when)}</h3>
          ${i.body || ""}
          ${settingsTable(i.settings)}
        </div>`).join("");
    }
    return `
      <section class="step${ref ? " ref" : ""}" id="${s.id}">
        <div class="num">${++n}</div>
        <h2>${esc(s.title)}</h2>
        <p class="lede">${s.lede}</p>
        ${body}
      </section>`;
  }).join("");
}

document.getElementById("steps").addEventListener("click", e => {
  if (!e.target.matches(".toggle-all")) return;
  const all = [...e.target.parentElement.querySelectorAll("details.emu")];
  const open = !all.every(d => d.open);
  all.forEach(d => (d.open = open));
  e.target.textContent = open ? "Collapse all" : "Expand all";
});

function applyHash() {
  const { device, layout } = readHash();
  const d = DEVICES.find(x => x.id === device) || DEVICES[0];
  $device.value = d.id;
  fillLayouts(d, layout);
  render();
}
$device.addEventListener("change", () => {
  fillLayouts(DEVICES.find(d => d.id === $device.value), $layout.value);
  render();
});
$layout.addEventListener("change", render);
window.addEventListener("hashchange", applyHash);
applyHash();
</script>
</body>
</html>
